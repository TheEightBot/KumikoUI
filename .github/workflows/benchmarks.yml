name: Benchmarks

# Manual and weekly: runs the BenchmarkDotNet suite in bench/KumikoUI.Benchmarks and uploads the results as an
# artifact. Not a required check and never gates a pull request: timings on a shared runner are too noisy to
# fail a build on. The allocation budgets that do gate are unit tests (PerformanceBudgetTests, run by ci.yml).
# See bench/README.md for the budgets and how to read the numbers.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: BenchmarkDotNet --filter glob (default runs everything)
        required: false
        default: '*'
      job:
        description: BenchmarkDotNet job (short is quick and approximate, medium or default is slower and steadier)
        required: false
        default: short
        type: choice
        options: [short, medium, default]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer computes the version from git tags

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Run benchmarks
        env:
          BENCH_FILTER: ${{ inputs.filter || '*' }}
          BENCH_JOB: ${{ inputs.job || 'short' }}
        run: dotnet run -c Release --project bench/KumikoUI.Benchmarks
          -- --filter "$BENCH_FILTER" --job "$BENCH_JOB" --artifacts BenchmarkDotNet.Artifacts

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Benchmarks"
            echo "Runner: $(uname -sr), $(nproc) cores, .NET $(dotnet --version)"
            for f in BenchmarkDotNet.Artifacts/results/*-report-github.md; do
              [ -e "$f" ] || continue
              echo
              cat "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results
          if-no-files-found: warn
