name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'          # e.g. v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-*'         # e.g. v1.2.3-beta.1
  # Manual runs are allowed only against a version tag (choose the tag in "Use workflow from"),
  # e.g. to retry a failed publish. The version always comes from the tag, never from free input.
  workflow_dispatch:

# Least privilege: jobs only read the repository; the publish job alone may write (GitHub Release).
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Resolve and validate the version: must be a v* tag on main, and MinVer must agree
  # ─────────────────────────────────────────────────────────────────────────────
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Require a version tag
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || ! printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Publishing runs only from a version tag (vX.Y.Z or vX.Y.Z-suffix); got ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer and the main-branch check need full history and tags

      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main."
            exit 1
          fi

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Resolve version with MinVer and compare with the tag
        id: ver
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MINVER_VERSION=$(dotnet msbuild src/KumikoUI.Core/KumikoUI.Core.csproj -t:MinVer -getProperty:MinVerVersion -p:Configuration=Release | tail -n 1 | tr -d '[:space:]')
          echo "Tag: $TAG_VERSION  MinVer: $MINVER_VERSION"
          if [ "$TAG_VERSION" != "$MINVER_VERSION" ]; then
            echo "::error::MinVer computed $MINVER_VERSION but the tag says $TAG_VERSION."
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Pack KumikoUI.Core and KumikoUI.SkiaSharp  (plain net10.0 — Linux is fine)
  # ─────────────────────────────────────────────────────────────────────────────
  pack-core:
    name: Pack Core & SkiaSharp
    runs-on: ubuntu-latest
    needs: resolve-version
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer computes the version from git tags

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Restore
        run: |
          dotnet restore src/KumikoUI.Core/KumikoUI.Core.csproj
          dotnet restore src/KumikoUI.SkiaSharp/KumikoUI.SkiaSharp.csproj

      - name: Pack — KumikoUI.Core
        run: |
          dotnet pack src/KumikoUI.Core/KumikoUI.Core.csproj \
            --no-restore \
            -c Release \
            -o ./artifacts

      - name: Pack — KumikoUI.SkiaSharp
        run: |
          dotnet pack src/KumikoUI.SkiaSharp/KumikoUI.SkiaSharp.csproj \
            --no-restore \
            -c Release \
            -o ./artifacts

      - name: Verify package versions
        run: |
          ls -lh artifacts/
          for p in KumikoUI.Core KumikoUI.SkiaSharp; do
            test -f "artifacts/$p.${VERSION}.nupkg" || { echo "::error::artifacts/$p.${VERSION}.nupkg not produced"; exit 1; }
          done

      - name: Upload Core + SkiaSharp packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-core-skiasharp
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Upload Core + SkiaSharp symbol packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snupkg-core-skiasharp
          path: artifacts/*.snupkg
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Pack KumikoUI.Maui (multi-target MAUI — needs Windows for Windows TFM)
  # ─────────────────────────────────────────────────────────────────────────────
  pack-maui:
    name: Pack KumikoUI.Maui (all TFMs)
    runs-on: windows-latest
    needs: resolve-version
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer computes the version from git tags

      - name: Setup .NET + MAUI workloads (pinned)
        uses: ./.github/actions/setup-dotnet
        with:
          workloads: maui

      - name: Restore
        run: dotnet restore src/KumikoUI.Maui/KumikoUI.Maui.csproj

      - name: Pack — KumikoUI.Maui
        run: |
          dotnet pack src/KumikoUI.Maui/KumikoUI.Maui.csproj `
            --no-restore `
            -c Release `
            -o ./artifacts

      - name: Verify package version
        run: |
          Get-ChildItem artifacts -Recurse | Format-Table Name, Length
          if (-not (Get-ChildItem artifacts -Filter "*.$env:VERSION.nupkg")) { Write-Error "No package with version $env:VERSION was produced"; exit 1 }

      - name: Upload Maui package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-maui
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Upload Maui symbol package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snupkg-maui
          path: artifacts/*.snupkg
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # 3b. Pack KumikoUI.Uno (multi-head Uno library — all heads pack on a Windows runner)
  # ─────────────────────────────────────────────────────────────────────────────
  pack-uno:
    name: Pack KumikoUI.Uno (all heads)
    runs-on: windows-latest
    needs: resolve-version
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer computes the version from git tags

      - name: Setup .NET + Uno workloads (pinned)
        uses: ./.github/actions/setup-dotnet
        with:
          restore-project: src/KumikoUI.Uno/KumikoUI.Uno.csproj

      - name: Restore
        run: dotnet restore src/KumikoUI.Uno/KumikoUI.Uno.csproj

      - name: Pack — KumikoUI.Uno
        run: |
          dotnet pack src/KumikoUI.Uno/KumikoUI.Uno.csproj `
            --no-restore `
            -c Release `
            -o ./artifacts

      - name: Verify package version
        run: |
          Get-ChildItem artifacts -Recurse | Format-Table Name, Length
          if (-not (Get-ChildItem artifacts -Filter "*.$env:VERSION.nupkg")) { Write-Error "No package with version $env:VERSION was produced"; exit 1 }

      - name: Upload Uno package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-uno
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Upload Uno symbol package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snupkg-uno
          path: artifacts/*.snupkg
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Run tests before publishing (gate publish on green tests)
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Run Core tests
    runs-on: ubuntu-latest
    needs: resolve-version

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Restore & Test
        run: |
          dotnet restore tests/KumikoUI.Core.Tests/KumikoUI.Core.Tests.csproj
          dotnet test tests/KumikoUI.Core.Tests/KumikoUI.Core.Tests.csproj \
            -c Release --logger "trx" --results-directory TestResults

  test-uno:
    name: Run Uno tests
    runs-on: windows-latest
    needs: resolve-version

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET + Uno workloads (pinned)
        uses: ./.github/actions/setup-dotnet
        with:
          restore-project: src/KumikoUI.Uno/KumikoUI.Uno.csproj

      - name: Test
        run: dotnet test tests/KumikoUI.Uno.Tests/KumikoUI.Uno.Tests.csproj -c Release --logger "trx" --results-directory TestResults

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Publish all packages to NuGet.org and create a GitHub Release
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: [ pack-core, pack-maui, pack-uno, test, test-uno ]
    permissions:
      contents: write   # create the GitHub Release
    environment: nuget-publish      # required reviewer + v* tags only (see .github/settings/README.md)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Download all package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nuget-*
          path: ./publish
          merge-multiple: true

      - name: Download all symbol artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: snupkg-*
          path: ./publish
          merge-multiple: true

      - name: List packages to publish
        run: ls -lh publish/

      - name: Push .nupkg packages to NuGet.org
        run: |
          for f in publish/*.nupkg; do
            echo "Pushing $f …"
            dotnet nuget push "$f" \
              --api-key ${{ secrets.EIGHTBOT_NUGET_APIKEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Push .snupkg symbol packages to NuGet.org
        run: |
          for f in publish/*.snupkg; do
            [ -f "$f" ] || continue
            echo "Pushing symbol package $f …"
            dotnet nuget push "$f" \
              --api-key ${{ secrets.EIGHTBOT_NUGET_APIKEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      # ── GitHub Release ─────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: publish/*.nupkg
