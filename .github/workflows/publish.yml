name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'          # e.g. v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-*'         # e.g. v1.2.3-beta.1
  # Manual runs follow exactly the same resolve, test, pack and validate path as a tag push.
  #  - dry_run on (default): runs on any ref, packs and validates everything, but never pushes to NuGet.org
  #    or creates a GitHub Release.
  #  - dry_run off: allowed only against a version tag (choose the tag in "Use workflow from"), e.g. to retry
  #    a failed publish. The version always comes from the tag, never from free input.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and validate only; do not push to NuGet.org or create a GitHub Release
        type: boolean
        default: true

# One publish at a time per ref, so a tag push and a manual retry cannot push the same version twice.
# Never cancel a run that may already be mid-push.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: jobs only read the repository; the publish job alone may write (GitHub Release).
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # "true" for a manual run with dry_run on; otherwise not "true". Dry runs never publish.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Resolve and validate the version: must be a v* tag on main, and MinVer must agree
  #    (a dry run skips only the tag and main checks; it still computes the version and the release notes)
  # ─────────────────────────────────────────────────────────────────────────────
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Require a version tag
        if: env.DRY_RUN != 'true'
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || ! printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Publishing runs only from a version tag (vX.Y.Z or vX.Y.Z-suffix); got ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer and the main-branch check need full history and tags

      - name: Require the tagged commit to be on main
        if: env.DRY_RUN != 'true'
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main."
            exit 1
          fi

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Resolve version with MinVer and compare with the tag
        id: ver
        run: |
          MINVER_VERSION=$(dotnet msbuild src/KumikoUI.Core/KumikoUI.Core.csproj -t:MinVer -getProperty:MinVerVersion -p:Configuration=Release | tail -n 1 | tr -d '[:space:]')
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: MinVer computed $MINVER_VERSION for ${GITHUB_REF_NAME}"
            echo "version=$MINVER_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag: $TAG_VERSION  MinVer: $MINVER_VERSION"
          if [ "$TAG_VERSION" != "$MINVER_VERSION" ]; then
            echo "::error::MinVer computed $MINVER_VERSION but the tag says $TAG_VERSION."
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      # Release notes come from CHANGELOG.md and feed both the GitHub Release body and PackageReleaseNotes
      # (the pack jobs download release-notes.md). A stable release must have its own dated section;
      # a prerelease (or a dry run, whose version is a computed prerelease) uses its section if present,
      # otherwise the Unreleased section.
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if eng/changelog-section.sh "$VERSION" > release-notes.md; then
            echo "Using the [$VERSION] section of CHANGELOG.md"
          elif [[ "$VERSION" == *-* ]]; then
            eng/changelog-section.sh Unreleased > release-notes.md
            echo "Prerelease: using the [Unreleased] section of CHANGELOG.md"
          else
            echo "::error::CHANGELOG.md needs a '## [$VERSION] - <date>' section before $VERSION can be released."
            exit 1
          fi
          printf '\n**Full changelog:** https://github.com/%s/blob/%s/CHANGELOG.md\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Pack KumikoUI.Core and KumikoUI.SkiaSharp  (plain net10.0 — Linux is fine)
  # ─────────────────────────────────────────────────────────────────────────────
  pack-core:
    name: Pack Core & SkiaSharp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: resolve-version
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer computes the version from git tags

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: Restore
        run: |
          dotnet restore src/KumikoUI.Core/KumikoUI.Core.csproj
          dotnet restore src/KumikoUI.SkiaSharp/KumikoUI.SkiaSharp.csproj

      - name: Pack — KumikoUI.Core
        run: |
          dotnet pack src/KumikoUI.Core/KumikoUI.Core.csproj \
            --no-restore \
            -c Release \
            -p:KumikoReleaseNotesFile="${{ runner.temp }}/notes/release-notes.md" \
            -o ./artifacts

      - name: Pack — KumikoUI.SkiaSharp
        run: |
          dotnet pack src/KumikoUI.SkiaSharp/KumikoUI.SkiaSharp.csproj \
            --no-restore \
            -c Release \
            -p:KumikoReleaseNotesFile="${{ runner.temp }}/notes/release-notes.md" \
            -o ./artifacts

      - name: Verify package versions
        run: |
          ls -lh artifacts/
          for p in KumikoUI.Core KumikoUI.SkiaSharp; do
            test -f "artifacts/$p.${VERSION}.nupkg" || { echo "::error::artifacts/$p.${VERSION}.nupkg not produced"; exit 1; }
          done

      - name: Upload Core + SkiaSharp packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-core-skiasharp
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Upload Core + SkiaSharp symbol packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snupkg-core-skiasharp
          path: artifacts/*.snupkg
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Pack KumikoUI.Maui (multi-target MAUI — needs Windows for Windows TFM)
  # ─────────────────────────────────────────────────────────────────────────────
  pack-maui:
    name: Pack KumikoUI.Maui (all TFMs)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: resolve-version
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer computes the version from git tags

      - name: Setup .NET + MAUI workloads (pinned)
        uses: ./.github/actions/setup-dotnet
        with:
          workloads: maui

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: Restore
        run: dotnet restore src/KumikoUI.Maui/KumikoUI.Maui.csproj

      - name: Pack — KumikoUI.Maui
        run: |
          dotnet pack src/KumikoUI.Maui/KumikoUI.Maui.csproj `
            --no-restore `
            -c Release `
            -p:KumikoReleaseNotesFile="${{ runner.temp }}/notes/release-notes.md" `
            -o ./artifacts

      - name: Verify package version
        run: |
          Get-ChildItem artifacts -Recurse | Format-Table Name, Length
          if (-not (Get-ChildItem artifacts -Filter "*.$env:VERSION.nupkg")) { Write-Error "No package with version $env:VERSION was produced"; exit 1 }

      - name: Upload Maui package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-maui
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Upload Maui symbol package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snupkg-maui
          path: artifacts/*.snupkg
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # 3b. Pack KumikoUI.Uno (multi-head Uno library — all heads pack on a Windows runner)
  # ─────────────────────────────────────────────────────────────────────────────
  pack-uno:
    name: Pack KumikoUI.Uno (all heads)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: resolve-version
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer computes the version from git tags

      - name: Setup .NET + Uno workloads (pinned)
        uses: ./.github/actions/setup-dotnet
        with:
          restore-project: src/KumikoUI.Uno/KumikoUI.Uno.csproj

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: Restore
        run: dotnet restore src/KumikoUI.Uno/KumikoUI.Uno.csproj

      - name: Pack — KumikoUI.Uno
        run: |
          dotnet pack src/KumikoUI.Uno/KumikoUI.Uno.csproj `
            --no-restore `
            -c Release `
            -p:KumikoReleaseNotesFile="${{ runner.temp }}/notes/release-notes.md" `
            -o ./artifacts

      - name: Verify package version
        run: |
          Get-ChildItem artifacts -Recurse | Format-Table Name, Length
          if (-not (Get-ChildItem artifacts -Filter "*.$env:VERSION.nupkg")) { Write-Error "No package with version $env:VERSION was produced"; exit 1 }

      - name: Upload Uno package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-uno
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Upload Uno symbol package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snupkg-uno
          path: artifacts/*.snupkg
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Run tests before publishing (gate publish on green tests)
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Run Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: resolve-version

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Restore & Test
        run: |
          dotnet restore tests/KumikoUI.Core.Tests/KumikoUI.Core.Tests.csproj
          dotnet test tests/KumikoUI.Core.Tests/KumikoUI.Core.Tests.csproj \
            -c Release --logger "trx" --results-directory TestResults
          dotnet restore tests/KumikoUI.SourceGenerators.Tests/KumikoUI.SourceGenerators.Tests.csproj
          dotnet test tests/KumikoUI.SourceGenerators.Tests/KumikoUI.SourceGenerators.Tests.csproj \
            -c Release --logger "trx" --results-directory TestResults
          dotnet restore tests/KumikoUI.Maui.Tests/KumikoUI.Maui.Tests.csproj
          dotnet test tests/KumikoUI.Maui.Tests/KumikoUI.Maui.Tests.csproj \
            -c Release --logger "trx" --results-directory TestResults

  test-uno:
    name: Run Uno tests
    runs-on: windows-latest
    timeout-minutes: 30
    needs: resolve-version

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET + Uno workloads (pinned)
        uses: ./.github/actions/setup-dotnet
        with:
          restore-project: src/KumikoUI.Uno/KumikoUI.Uno.csproj

      - name: Test
        run: dotnet test tests/KumikoUI.Uno.Tests/KumikoUI.Uno.Tests.csproj -c Release --logger "trx" --results-directory TestResults

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Validate the complete package set (runs for dry runs too)
  # ─────────────────────────────────────────────────────────────────────────────
  validate-packages:
    name: Validate packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ resolve-version, pack-core, pack-maui, pack-uno, test, test-uno ]
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - name: Download all package and symbol artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{nuget,snupkg}-*'
          path: ./publish
          merge-multiple: true

      # Every package must ship at the release version with a matching symbol package.
      - name: Require four packages, each with a symbol package
        run: |
          ls -lh publish/
          failed=0
          for id in KumikoUI.Core KumikoUI.SkiaSharp KumikoUI.Maui KumikoUI.Uno; do
            for ext in nupkg snupkg; do
              if [ ! -f "publish/${id}.${VERSION}.${ext}" ]; then
                echo "::error::publish/${id}.${VERSION}.${ext} is missing"
                failed=1
              fi
            done
          done
          for f in publish/*.nupkg; do
            if [ ! -f "${f%.nupkg}.snupkg" ]; then
              echo "::error::${f} has no matching .snupkg symbol package"
              failed=1
            fi
          done
          if [ "$(find publish -maxdepth 1 -name '*.nupkg' | wc -l)" -ne 4 ]; then
            echo "::error::Expected exactly four .nupkg files"
            failed=1
          fi
          exit $failed

      - name: Require the CHANGELOG release notes in every package
        run: |
          for f in publish/*.nupkg; do
            if ! unzip -p "$f" '*.nuspec' | grep -q '<releaseNotes>'; then
              echo "::error::$f has no releaseNotes in its nuspec"
              exit 1
            fi
            if unzip -p "$f" '*.nuspec' | grep -q 'Release notes for every version'; then
              echo "::error::$f still carries the placeholder release notes instead of the CHANGELOG section"
              exit 1
            fi
          done

      - name: Dry run summary
        if: env.DRY_RUN == 'true'
        run: |
          echo "Dry run: $VERSION packed and validated; nothing was pushed to NuGet.org." >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. Publish all packages to NuGet.org (never for a dry run)
  #    Authenticates with NuGet Trusted Publishing: a short-lived API key from a GitHub OIDC token.
  #    No long-lived secret is stored. The one-time nuget.org setup is in CONTRIBUTING.md.
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to NuGet.org
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ validate-packages ]
    permissions:
      contents: read
      id-token: write   # request the OIDC token NuGet/login exchanges for a short-lived API key (this job only)
    environment: nuget-publish      # required reviewer + v* tags only (see .github/settings/README.md)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Download all package and symbol artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{nuget,snupkg}-*'
          path: ./publish
          merge-multiple: true

      - name: List packages to publish
        run: ls -lh publish/

      - name: Log in to NuGet.org (Trusted Publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}    # nuget.org profile name that owns the trusted-publisher policy

      # --skip-duplicate lets a retry after a partial failure finish the remaining packages.
      - name: Push .nupkg packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for f in publish/*.nupkg; do
            echo "Pushing $f …"
            dotnet nuget push "$f" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Push .snupkg symbol packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for f in publish/*.snupkg; do
            echo "Pushing symbol package $f …"
            dotnet nuget push "$f" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # 7. GitHub Release with the CHANGELOG section as the body (never for a dry run)
  #    A separate job so only this one holds contents: write and only publish holds id-token: write.
  # ─────────────────────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ publish ]
    permissions:
      contents: write   # create the GitHub Release

    steps:
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Download all package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nuget-*
          path: ./publish
          merge-multiple: true

      # Runs for tag pushes and for manual runs against a tag (the only refs resolve-version accepts).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: notes/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: publish/*.nupkg
