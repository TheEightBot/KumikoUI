name: CI

# Runs on every push and pull request to main. The jobs below are required status checks in the main-branch
# ruleset (.github/settings/), so the workflow itself has NO `paths` filter (a filtered-out workflow reports no
# checks and blocks the pull request). Instead the `changes` job decides whether code changed, and every build
# job is skipped when only documentation changed. A job skipped through its own `if` counts as passed for a
# required check, so documentation-only pull requests stay mergeable under the same check names.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Decide whether anything other than documentation changed ───
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists a pull request's files through the API
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `code` is true when any file outside the documentation patterns changed. Pushes to main compare with the
      # previous commit; a push with no usable base (first push) counts as a code change.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!images/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/dependabot.yml'

  # ─── Documentation-only change: nothing to build ───
  docs-only:
    name: Documentation-only change (no build needed)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: changes
    if: needs.changes.outputs.code != 'true'
    steps:
      - run: echo "Only documentation changed; the build jobs were skipped and count as passed."

  # ─── Build + test KumikoUI.Core and KumikoUI.SkiaSharp (platform-agnostic) ───
  build-core:
    name: Build & Test (Core + SkiaSharp)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer computes the version from git tags

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          cache-nuget: 'true'

      - name: Restore
        run: dotnet restore src/KumikoUI.Core/KumikoUI.Core.csproj
          && dotnet restore src/KumikoUI.SkiaSharp/KumikoUI.SkiaSharp.csproj
          && dotnet restore tests/KumikoUI.Core.Tests/KumikoUI.Core.Tests.csproj
          && dotnet restore tests/KumikoUI.SourceGenerators.Tests/KumikoUI.SourceGenerators.Tests.csproj

      - name: Build — Core
        run: dotnet build src/KumikoUI.Core/KumikoUI.Core.csproj
          --no-restore -c Release

      - name: Build — SkiaSharp
        run: dotnet build src/KumikoUI.SkiaSharp/KumikoUI.SkiaSharp.csproj
          --no-restore -c Release

      # No public type may share a simple name with another KumikoUI type or a type of MAUI, WinUI/Uno, WPF,
      # Windows Forms, Avalonia or the community toolkits' grids (eng/TypeNameCheck; see CONTRIBUTING.md).
      - name: Check public type names — Core + SkiaSharp
        run: dotnet run --project eng/TypeNameCheck/TypeNameCheck.csproj -c Release
          -- src/KumikoUI.Core/bin/Release/net10.0/KumikoUI.Core.dll
          src/KumikoUI.SkiaSharp/bin/Release/net10.0/KumikoUI.SkiaSharp.dll

      - name: Test
        run: dotnet test tests/KumikoUI.Core.Tests/KumikoUI.Core.Tests.csproj
          --no-restore -c Release --logger "trx" --logger "GitHubActions" --results-directory TestResults

      - name: Test — source generator
        run: dotnet test tests/KumikoUI.SourceGenerators.Tests/KumikoUI.SourceGenerators.Tests.csproj
          --no-restore -c Release --logger "trx" --logger "GitHubActions" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/

      # Validate that packages are packable (dry run — no push)
      - name: Pack — Core (dry run)
        run: dotnet pack src/KumikoUI.Core/KumikoUI.Core.csproj
          --no-restore -c Release -o /tmp/ci-pack

      - name: Pack — SkiaSharp (dry run)
        run: dotnet pack src/KumikoUI.SkiaSharp/KumikoUI.SkiaSharp.csproj
          --no-restore -c Release -o /tmp/ci-pack

  # ─── Build KumikoUI.Maui (all TFMs including Windows requires Windows runner) ─
  build-maui:
    name: Build (KumikoUI.Maui — all TFMs)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [changes, build-core]
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer computes the version from git tags

      - name: Setup .NET + MAUI workloads (pinned)
        uses: ./.github/actions/setup-dotnet
        with:
          workloads: maui
          cache-nuget: 'true'

      - name: Restore
        run: dotnet restore src/KumikoUI.Maui/KumikoUI.Maui.csproj

      - name: Build — Maui
        run: dotnet build src/KumikoUI.Maui/KumikoUI.Maui.csproj
          --no-restore -c Release

      - name: Check public type names — Maui
        run: dotnet run --project eng/TypeNameCheck/TypeNameCheck.csproj -c Release
          -- src/KumikoUI.Maui/bin/Release/net10.0-windows10.0.19041.0/KumikoUI.Core.dll
          src/KumikoUI.Maui/bin/Release/net10.0-windows10.0.19041.0/KumikoUI.SkiaSharp.dll
          src/KumikoUI.Maui/bin/Release/net10.0-windows10.0.19041.0/KumikoUI.Maui.dll

      # Validate packability (dry run)
      - name: Pack — Maui (dry run)
        run: dotnet pack src/KumikoUI.Maui/KumikoUI.Maui.csproj
          --no-restore -c Release -o C:\ci-pack

  # ─── Build KumikoUI.Uno (multi-head Uno library — all heads cross-compile on Windows) ─
  build-uno:
    name: Build & Test (KumikoUI.Uno — all heads)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [changes, build-core]
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer computes the version from git tags

      - name: Setup .NET + Uno workloads (pinned)
        uses: ./.github/actions/setup-dotnet
        with:
          restore-project: src/KumikoUI.Uno/KumikoUI.Uno.csproj
          cache-nuget: 'true'

      - name: Restore
        run: dotnet restore src/KumikoUI.Uno/KumikoUI.Uno.csproj

      - name: Build — Uno
        run: dotnet build src/KumikoUI.Uno/KumikoUI.Uno.csproj
          --no-restore -c Release

      - name: Check public type names — Uno
        run: dotnet run --project eng/TypeNameCheck/TypeNameCheck.csproj -c Release
          -- src/KumikoUI.Uno/bin/Release/net10.0-desktop/KumikoUI.Core.dll
          src/KumikoUI.Uno/bin/Release/net10.0-desktop/KumikoUI.SkiaSharp.dll
          src/KumikoUI.Uno/bin/Release/net10.0-desktop/KumikoUI.Uno.dll

      # Validate packability (dry run — exercises the full multi-head pack)
      - name: Pack — Uno (dry run)
        run: dotnet pack src/KumikoUI.Uno/KumikoUI.Uno.csproj
          --no-restore -c Release -o C:\ci-pack

      # Fails on AndroidX/content entries, a package over 2 MB, dev-time dependencies or missing metadata
      - name: Check package contents — Uno
        shell: bash
        run: eng/check-uno-package.sh 'C:\ci-pack'

      # Uno input-mapping unit tests (net10.0-desktop head)
      - name: Test — Uno
        run: dotnet test tests/KumikoUI.Uno.Tests/KumikoUI.Uno.Tests.csproj
          -c Release --logger "trx" --results-directory TestResults

      - name: Upload Uno test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-uno
          path: TestResults/

  # ─── Core + SkiaSharp tests on the other operating systems ───
  # Ubuntu runs in build-core above. SkiaSharp ships per-OS native binaries and text shaping/font fallback differs
  # per platform, so the same test suite runs on Windows and macOS too.
  test-core-os:
    name: Test (Core + SkiaSharp — ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-15 ]   # macos-15: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer computes the version from git tags

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          cache-nuget: 'true'

      - name: Test
        run: dotnet test tests/KumikoUI.Core.Tests/KumikoUI.Core.Tests.csproj
          -c Release --logger "trx" --logger "GitHubActions" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/

  # ─── Apple heads and samples (MAUI): iOS + Mac Catalyst need macOS and Xcode ───
  # Runner and Xcode are pinned: the iOS / Mac Catalyst SDK of the pinned workload set (.github/actions/setup-dotnet)
  # requires Xcode 27.1 to build apps, which only the xcode-27 image has (macos-15 and macos-26 stop at Xcode 26.x).
  # Changing the workload set or the Xcode version means updating both together. iOS builds target the simulator and Mac Catalyst builds skip code signing, so no certificates or
  # provisioning profiles are needed.
  build-apple-maui:
    name: Build (MAUI — iOS + Mac Catalyst, library + sample)
    runs-on: xcode-27
    timeout-minutes: 60
    needs: [changes, build-core]
    if: needs.changes.outputs.code == 'true'
    env:
      XCODE_VERSION: '27.1'   # Xcode_<version>.app under /Applications on the runner image

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer computes the version from git tags

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Setup .NET + MAUI workloads (pinned)
        uses: ./.github/actions/setup-dotnet
        with:
          workloads: maui
          cache-nuget: 'true'

      - name: Build library — iOS
        run: dotnet build src/KumikoUI.Maui/KumikoUI.Maui.csproj -f net10.0-ios -c Release

      - name: Build library — Mac Catalyst
        run: dotnet build src/KumikoUI.Maui/KumikoUI.Maui.csproj -f net10.0-maccatalyst -c Release

      - name: Build sample — iOS (simulator)
        run: dotnet build samples/SampleApp.Maui/SampleApp.Maui.csproj -f net10.0-ios -c Release
          -p:RuntimeIdentifier=iossimulator-arm64

      - name: Build sample — Mac Catalyst
        run: dotnet build samples/SampleApp.Maui/SampleApp.Maui.csproj -f net10.0-maccatalyst -c Release
          -p:RuntimeIdentifier=maccatalyst-arm64 -p:EnableCodeSigning=false

      # Launch smoke check: starts the Mac Catalyst sample and requires it to still be running after 20 seconds.
      # It is OFF by default because the sample only launches on current macOS once it adopts the UIScene lifecycle
      # (#121, pull request #162); until that lands the app exits at startup and the step would fail every run.
      # After #162 is merged, set the repository variable CATALYST_LAUNCH_SMOKE to 'true' (Settings > Secrets and
      # variables > Actions > Variables) and, once it is stable, delete this condition.
      - name: Launch smoke check — Mac Catalyst sample
        if: vars.CATALYST_LAUNCH_SMOKE == 'true'
        run: |
          app="samples/SampleApp.Maui/bin/Release/net10.0-maccatalyst/maccatalyst-arm64/SampleApp.Maui.app"
          "$app/Contents/MacOS/SampleApp.Maui" &
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then
            echo "Sample is still running after 20 seconds."
            kill "$pid"
          else
            echo "::error::SampleApp.Maui exited during startup."
            exit 1
          fi

  # ─── Apple heads and samples (Uno): iOS needs macOS and Xcode; the desktop (Skia) head is built here as well ───
  build-apple-uno:
    name: Build (Uno — iOS + desktop, library + sample)
    runs-on: xcode-27   # Xcode pinned below; see build-apple-maui
    timeout-minutes: 60
    needs: [changes, build-core]
    if: needs.changes.outputs.code == 'true'
    env:
      XCODE_VERSION: '27.1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer computes the version from git tags

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Setup .NET + Uno workloads (pinned)
        uses: ./.github/actions/setup-dotnet
        with:
          restore-project: samples/SampleApp.Uno/SampleApp.Uno.csproj
          cache-nuget: 'true'

      - name: Build library — iOS
        run: dotnet build src/KumikoUI.Uno/KumikoUI.Uno.csproj -f net10.0-ios -c Release

      - name: Build library — desktop
        run: dotnet build src/KumikoUI.Uno/KumikoUI.Uno.csproj -f net10.0-desktop -c Release

      - name: Build sample — iOS (simulator)
        run: dotnet build samples/SampleApp.Uno/SampleApp.Uno.csproj -f net10.0-ios -c Release
          -p:RuntimeIdentifier=iossimulator-arm64

      - name: Build sample — desktop
        run: dotnet build samples/SampleApp.Uno/SampleApp.Uno.csproj -f net10.0-desktop -c Release

  # ─── Android sample heads ───
  # Windows, not Linux: the samples (and KumikoUI.Maui) also target iOS, and restore needs the iOS workload packs,
  # which the MAUI workload installs on Windows but does not exist on Linux.
  build-samples-android:
    name: Build (Samples — Android)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [changes, build-core]
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer computes the version from git tags

      - name: Setup .NET + MAUI and Uno workloads (pinned)
        uses: ./.github/actions/setup-dotnet
        with:
          workloads: maui
          restore-project: samples/SampleApp.Uno/SampleApp.Uno.csproj
          cache-nuget: 'true'

      - name: Build sample — MAUI Android
        run: dotnet build samples/SampleApp.Maui/SampleApp.Maui.csproj -f net10.0-android -c Release

      - name: Build sample — Uno Android
        run: dotnet build samples/SampleApp.Uno/SampleApp.Uno.csproj -f net10.0-android -c Release

  # ─── WebAssembly sample head (Linux: the Emscripten native relink of Uno's Skia shims fails on Windows) ───
  build-sample-wasm:
    name: Build (Sample — Uno WebAssembly)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, build-core]
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer computes the version from git tags

      # wasm-tools for the head itself, android because restore evaluates every head the Uno projects target on
      # Linux (Uno drops iOS there); not a workload restore, which would also ask for iOS.
      - name: Setup .NET + wasm-tools and android workloads (pinned)
        uses: ./.github/actions/setup-dotnet
        with:
          workloads: wasm-tools android
          cache-nuget: 'true'

      - name: Build sample — Uno WebAssembly
        run: dotnet build samples/SampleApp.Uno/SampleApp.Uno.csproj -f net10.0-browserwasm -c Release
